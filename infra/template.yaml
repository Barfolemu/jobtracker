AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Jobtracker — single-user job search tracker (Milestone 1: storage + API + UI, no Gmail yet)

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5500
    Description: >
      Origin the frontend is served from (S3/CloudFront URL in production).
      Must be an exact origin, not '*' — CORS requests carry the auth cookie.
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Random secret used to sign session cookies. Generate with
      `openssl rand -hex 32` and pass via --parameter-overrides;
      do not commit it. Rotating it invalidates all existing sessions.
  GoogleClientId:
    Type: String
    Description: OAuth2 client ID from the Google Cloud project (see .env).
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: OAuth2 client secret from the Google Cloud project (see .env).
  GoogleRefreshToken:
    Type: String
    NoEcho: true
    Description: >
      Gmail readonly-scope refresh token from backend/scripts/gmail_auth.py
      (see .env).
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key used by the LangChain extraction chain (see .env).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref JobTrackerTable

Resources:
  JobTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
        AllowCredentials: true
      Auth:
        Authorizers:
          SessionAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - cookie
        DefaultAuthorizer: SessionAuthorizer

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.authorizer.handler
      Environment:
        Variables:
          SESSION_SECRET: !Ref SessionSecret

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JobTrackerApi}/authorizers/*"

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.auth.handler
      Environment:
        Variables:
          SESSION_SECRET: !Ref SessionSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTrackerTable
      Events:
        AuthStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/status
            Method: GET
            Auth:
              Authorizer: NONE
        AuthSetup:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/setup
            Method: POST
            Auth:
              Authorizer: NONE
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/login
            Method: POST
            Auth:
              Authorizer: NONE

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.api.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTrackerTable
      Events:
        ListJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs
            Method: GET
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs
            Method: POST
        UpdateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs/{id}
            Method: PUT
        DeleteJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs/{id}
            Method: DELETE

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "jobtracker-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "jobtracker-frontend-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  GmailAgentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: jobtracker-gmail-agent
      SecretString: !Sub |
        {
          "google_client_id": "${GoogleClientId}",
          "google_client_secret": "${GoogleClientSecret}",
          "google_refresh_token": "${GoogleRefreshToken}",
          "openai_api_key": "${OpenAiApiKey}"
        }

  GmailAgentDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: jobtracker-gmail-agent-deps
      ContentUri: ../backend/layers/gmail_agent_deps/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  GmailAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.gmail_agent.handler
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref GmailAgentDepsLayer
      Environment:
        Variables:
          GMAIL_AGENT_SECRET_ARN: !Ref GmailAgentSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTrackerTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GmailAgentSecret
      Events:
        ScheduledScan:
          Type: ScheduleV2
          Properties:
            Name: jobtracker-gmail-scan
            ScheduleExpression: "rate(60 minutes)"
            FlexibleTimeWindow:
              Mode: "OFF"

  JobTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobTrackerTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  JobTrackerTableName:
    Description: DynamoDB table name
    Value: !Ref JobTrackerTable
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${JobTrackerApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: S3 bucket holding the frontend static assets
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: CloudFront URL the frontend is served from
    Value: !Sub "https://${FrontendDistribution.DomainName}"
