AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Jobtracker — single-user job search tracker (Milestone 1: storage + API + UI, no Gmail yet)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref JobTrackerTable

Resources:
  JobTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobTrackerTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  JobTrackerTableName:
    Description: DynamoDB table name
    Value: !Ref JobTrackerTable
