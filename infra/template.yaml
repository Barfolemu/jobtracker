AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Jobtracker — single-user job search tracker (Milestone 1: storage + API + UI, no Gmail yet)

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5500
    Description: >
      Origin the frontend is served from (S3/CloudFront URL in production).
      Must be an exact origin, not '*' — CORS requests carry the auth cookie.
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Random secret used to sign session cookies. Generate with
      `openssl rand -hex 32` and pass via --parameter-overrides;
      do not commit it. Rotating it invalidates all existing sessions.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref JobTrackerTable

Resources:
  JobTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
        AllowCredentials: true
      Auth:
        Authorizers:
          SessionAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - cookie
        DefaultAuthorizer: SessionAuthorizer

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.authorizer.handler
      Environment:
        Variables:
          SESSION_SECRET: !Ref SessionSecret

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JobTrackerApi}/authorizers/*"

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.auth.handler
      Environment:
        Variables:
          SESSION_SECRET: !Ref SessionSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTrackerTable
      Events:
        AuthStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/status
            Method: GET
            Auth:
              Authorizer: NONE
        AuthSetup:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/setup
            Method: POST
            Auth:
              Authorizer: NONE
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/auth/login
            Method: POST
            Auth:
              Authorizer: NONE

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: jobtracker.api.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTrackerTable
      Events:
        ListJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs
            Method: GET
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs
            Method: POST
        UpdateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs/{id}
            Method: PUT
        DeleteJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /api/jobs/{id}
            Method: DELETE

  JobTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobTrackerTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  JobTrackerTableName:
    Description: DynamoDB table name
    Value: !Ref JobTrackerTable
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${JobTrackerApi}.execute-api.${AWS::Region}.amazonaws.com"
